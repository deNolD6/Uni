    <script>
        const key = (code) => document.querySelector(`.k[data-key="${code}"]`);
    
        document.querySelectorAll('.k').forEach((btn) => {
            btn.addEventListener('click', () => btn.classList.toggle('is-active'));
        });
    
        window.addEventListener('contextmenu', (e) => e.preventDefault());
    
        window.addEventListener('keydown', (e) => {
            e.preventDefault(); // не дає Alt, Tab, Menu і стрілкам красти фокус чи скролити
            if (e.code === 'AltRight') key('ControlLeft')?.classList.remove('is-pressed');
            key(e.code)?.classList.add('is-pressed');
        });
    
        window.addEventListener('keyup', (e) => {
            key(e.code)?.classList.remove('is-pressed');
        });
    
        window.addEventListener('blur', () => {
            document.querySelectorAll('.k.is-pressed').forEach((el) => el.classList.remove('is-pressed'));
        });
    </script>
